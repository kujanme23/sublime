name: "Open redirect: LinkedIn /slink with credential phishing indicators"
description: |
  Detects LinkedIn /slink open redirect usage from non-LinkedIn senders, and requires additional phishing signals
  (cred-theft intent and/or suspicious landing page text via link analysis).
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain != "linkedin.com"
  and any(body.links,
          .href_url.domain.root_domain == "linkedin.com"
          and .href_url.path == "/slink"
          and strings.ilike(.href_url.query_params, "code=*")
  )
  and 1 of (
    any(ml.nlu_classifier(body.current_thread.text).intents,
        .name == "cred_theft" and .confidence in ("medium","high")
    ),
    any(body.links,
        regex.icontains(
          ml.link_analysis(., mode="aggressive").final_dom.display_text,
          '(sign\s?in|log\s?in|verify|password|microsoft|office\s?365|outlook|okta)'
        )
    )
  )
  and (
    (
      sender.email.domain.root_domain in $high_trust_sender_root_domains
      and not headers.auth_summary.dmarc.pass
    )
    or sender.email.domain.root_domain not in $high_trust_sender_root_domains
  )
attack_types:
 - "Credential Phishing"
tactics_and_techniques:
 - "Open redirect"
 - "Social engineering"
detection_methods:
 - "URL analysis"
 - "URL screenshot"
 - "Content analysis"
 - "Sender analysis"

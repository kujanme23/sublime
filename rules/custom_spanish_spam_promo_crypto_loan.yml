name: "Spam: Spanish promo/crypto/loan scam language (untrusted sender)"
description: |
  Detects common Spanish-language spam/scam themes (promos, crypto, loans, “gana dinero”), with a link and
  new/unsolicited sender profile.
type: "rule"
severity: "medium"
source: |
  type.inbound
  and ml.nlu_classifier(body.current_thread.text).language == "spanish"
  and length(body.links) > 0
  and 1 of (
    regex.icontains(subject.subject, '(oferta|promoci[oó]n|descuento|gana dinero|inversi[oó]n|criptomoneda|bitcoin|pr[eé]stamo)'),
    regex.icontains(body.current_thread.text, '(haz clic|entra aqu[ií]|solo hoy|urgente|cup[oó]n|bono|whatsapp|telegram)')
  )
  and (
    profile.by_sender_email().prevalence in ("new", "outlier")
    and not profile.by_sender_email().solicited
  )
  and (
    (
      sender.email.domain.root_domain in $high_trust_sender_root_domains
      and not headers.auth_summary.dmarc.pass
    )
    or sender.email.domain.root_domain not in $high_trust_sender_root_domains
  )
attack_types:
 - "Spam"
tactics_and_techniques:
 - "Social engineering"
detection_methods:
 - "Content analysis"
 - "Natural Language Understanding"
 - "Sender analysis"
 - "URL analysis"
